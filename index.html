<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahrtenbuch</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 650px;
  margin: auto;
  padding: 20px;
}
input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
}
button {
  background: #007aff;
  color: white;
  border: none;
  border-radius: 6px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}
th, td {
  border: 1px solid #000;
  padding: 6px;
  font-size: 13px;
}
th {
  background: #eee;
}
</style>
</head>

<body>

<h2>🚗 Fahrtenbuch (Finanzamt)</h2>

<input id="plate" placeholder="Kennzeichen (z. B. B-AB 123)">
<input id="start" type="number" placeholder="Kilometerstand Beginn">
<input id="end" type="number" placeholder="Kilometerstand Ende">
<input id="plz" placeholder="PLZ / Ziel">

<button onclick="saveTrip()">Fahrt speichern</button>

<hr>

<select id="yearFilter" onchange="render()"></select>
<button onclick="createPDF()">PDF Export (Jahr)</button>

<table>
<thead>
<tr>
  <th>Datum</th>
  <th>Kennz.</th>
  <th>Start</th>
  <th>Ende</th>
  <th>KM</th>
  <th>Ziel</th>
  <th>Bearbeiten</th>
  <th>Löschen</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
